<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">AI 时代名词关系图</title>
  <desc id="desc">LLM 是大脑，Agent 组合工具、循环与状态，Harness 是外面的工程外壳，MCP 与 Skill 连接工具和流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4442a"/>
    </marker>
  </defs>

  <rect x="24" y="54" width="712" height="330" rx="20" fill="#fffcf5" stroke="#b9ad99" stroke-dasharray="8 6"/>
  <text x="44" y="82" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" letter-spacing="2">HARNESS 工程外壳</text>
  <text x="44" y="104" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">权限 · 状态 · trace · 评测</text>

  <rect x="300" y="88" width="160" height="48" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="380" y="117" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15">LLM（大脑）</text>

  <rect x="286" y="184" width="188" height="86" rx="14" fill="#fffcf5" stroke="#b4442a" stroke-width="2"/>
  <text x="380" y="216" text-anchor="middle" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold">Agent</text>
  <text x="380" y="240" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="12">LLM + Tools + Loop + State</text>

  <rect x="64" y="190" width="150" height="62" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="139" y="216" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">Tools</text>
  <text x="139" y="238" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">可调用接口</text>

  <rect x="546" y="190" width="150" height="62" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="621" y="216" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">Memory</text>
  <text x="621" y="238" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">历史与状态</text>

  <rect x="110" y="300" width="170" height="54" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="195" y="324" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">ReAct</text>
  <text x="195" y="344" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">思考 → 行动 → 观察</text>

  <rect x="480" y="300" width="170" height="54" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="565" y="324" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">MCP / Skill</text>
  <text x="565" y="344" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">连接协议 / 复用流程</text>

  <line x1="380" y1="136" x2="380" y2="176" stroke="#b4442a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="286" y1="222" x2="222" y2="222" stroke="#b4442a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="474" y1="222" x2="538" y2="222" stroke="#b4442a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="270" x2="260" y2="292" stroke="#b4442a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="270" x2="500" y2="292" stroke="#b4442a" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="380" y="410" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">LLM 是大脑；Agent 是整体；Harness 是外壳；MCP 连接工具；Skill 复用流程。</text>
</svg>
