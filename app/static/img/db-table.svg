<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">数据库表的结构</title>
  <desc id="desc">messages 表包含 id、content、created_at 三列和两行记录。</desc>

  <text x="40" y="42" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" letter-spacing="2">messages 表</text>

  <rect x="40" y="66" width="640" height="196" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <line x1="40" y1="112" x2="680" y2="112" stroke="#d8cfc0"/>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#6b6b5e">
    <text x="64" y="96">列：id</text>
    <text x="210" y="96">列：content</text>
    <text x="470" y="96">列：created_at</text>
  </g>

  <line x1="180" y1="66" x2="180" y2="262" stroke="#d8cfc0"/>
  <line x1="450" y1="66" x2="450" y2="262" stroke="#d8cfc0"/>
  <line x1="40" y1="182" x2="680" y2="182" stroke="#d8cfc0"/>

  <g font-family="Consolas, Courier New, monospace" font-size="15" fill="#1f2933">
    <text x="78" y="150">1</text>
    <text x="200" y="150">Hello, SQLite</text>
    <text x="470" y="150">2026-10-29 10:00</text>
    <text x="78" y="220">2</text>
    <text x="200" y="220">第二条留言</text>
    <text x="470" y="220">2026-10-29 10:01</text>
  </g>

  <text x="360" y="300" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">每一行是一条记录，每一列是一个字段；id 唯一标识一行。</text>
</svg>
