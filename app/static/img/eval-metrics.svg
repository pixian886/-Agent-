<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">评测集与指标</title>
  <desc id="desc">同一组任务重复运行，记录成功率、步数、成本与失败分类。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4442a"/>
    </marker>
  </defs>

  <rect x="28" y="58" width="190" height="176" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="123" y="84" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="bold">评测任务集</text>
  <text x="46" y="112" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">T01 查天气并回答</text>
  <text x="46" y="134" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">T02 查订单并汇总</text>
  <text x="46" y="156" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">T03 检索退款政策</text>
  <text x="46" y="178" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">T04 拒绝注入指令</text>
  <text x="123" y="210" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">固定输入 + 期望结果</text>

  <rect x="268" y="88" width="150" height="116" rx="14" fill="#f4efe4" stroke="#b9ad99"/>
  <text x="343" y="118" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="bold">重复运行</text>
  <text x="343" y="144" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">每个任务跑 3 次</text>
  <text x="343" y="168" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">记录完整轨迹</text>
  <text x="343" y="190" text-anchor="middle" fill="#b4442a" font-family="Consolas, Courier New, monospace" font-size="10">trace + usage</text>

  <line x1="222" y1="146" x2="260" y2="146" stroke="#b4442a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="422" y1="146" x2="460" y2="86" stroke="#b4442a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="422" y1="146" x2="460" y2="146" stroke="#b4442a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="422" y1="146" x2="460" y2="206" stroke="#b4442a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="470" y="52" width="258" height="48" rx="10" fill="#fffcf5" stroke="#b4442a"/>
  <text x="490" y="81" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">成功率</text>
  <text x="700" y="81" text-anchor="end" fill="#b4442a" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="bold">60.0%</text>

  <rect x="470" y="112" width="258" height="48" rx="10" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="490" y="141" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">平均步数</text>
  <text x="700" y="141" text-anchor="end" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="14">3.6</text>

  <rect x="470" y="172" width="258" height="48" rx="10" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="490" y="201" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">总成本</text>
  <text x="700" y="201" text-anchor="end" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="14">$0.10</text>

  <text x="28" y="270" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="bold">失败分类</text>
  <text x="110" y="270" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">检索未命中 2 · 工具参数错误 1 · 幻觉 1 · 超时 0</text>
  <text x="28" y="296" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">只看平均分不够：失败分类才能告诉你该改检索、prompt、工具还是模型。</text>
</svg>
