<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">异常处理的执行流程</title>
  <desc id="desc">try 中的代码可能成功或抛出异常，except 接住异常，finally 负责收尾。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4442a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d7c0f"/>
    </marker>
  </defs>

  <rect x="40" y="90" width="180" height="80" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="130" y="122" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="16">try</text>
  <text x="130" y="148" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">可能出错的代码</text>

  <rect x="300" y="40" width="180" height="80" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="390" y="72" text-anchor="middle" fill="#4d7c0f" font-family="Consolas, Courier New, monospace" font-size="16">else</text>
  <text x="390" y="98" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">没有异常时执行</text>

  <rect x="300" y="150" width="180" height="80" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="390" y="182" text-anchor="middle" fill="#b4442a" font-family="Consolas, Courier New, monospace" font-size="16">except</text>
  <text x="390" y="208" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">接住指定异常</text>

  <rect x="550" y="95" width="140" height="80" rx="12" fill="#fffcf5" stroke="#b9ad99"/>
  <text x="620" y="127" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="16">finally</text>
  <text x="620" y="153" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">总会执行</text>

  <line x1="226" y1="110" x2="290" y2="82" stroke="#4d7c0f" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="226" y1="150" x2="290" y2="182" stroke="#b4442a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="486" y1="82" x2="540" y2="120" stroke="#6b6b5e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="486" y1="188" x2="540" y2="150" stroke="#6b6b5e" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="360" y="272" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">异常被捕获后，程序继续执行；finally 无论成功失败都会执行。</text>
</svg>
