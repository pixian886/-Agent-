<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">文件读写的三个步骤</title>
  <desc id="desc">打开文件，读写内容，关闭文件。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4442a"/>
    </marker>
  </defs>

  <rect x="40" y="70" width="170" height="130" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="125" y="108" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">第 1 步</text>
  <text x="125" y="138" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="14">open(...)</text>
  <text x="125" y="166" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">打开文件</text>

  <rect x="275" y="70" width="170" height="130" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="360" y="108" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">第 2 步</text>
  <text x="360" y="138" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="14">read / write</text>
  <text x="360" y="166" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">读写内容</text>

  <rect x="510" y="70" width="170" height="130" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="595" y="108" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">第 3 步</text>
  <text x="595" y="138" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="14">close()</text>
  <text x="595" y="166" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">关闭文件</text>

  <line x1="216" y1="135" x2="265" y2="135" stroke="#b4442a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="451" y1="135" x2="500" y2="135" stroke="#b4442a" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="360" y="240" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">用 with open(...) 时，关闭文件会自动完成。</text>
  <text x="360" y="264" text-anchor="middle" fill="#4d7c0f" font-family="Consolas, Courier New, monospace" font-size="13">with open("notes.txt", "w", encoding="utf-8") as f:</text>
</svg>
