<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">JSON 与 Python 字典的对应关系</title>
  <desc id="desc">左边是 JSON 对象，右边是 Python 字典，二者结构一致。</desc>

  <text x="40" y="42" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" letter-spacing="2">JSON</text>
  <text x="410" y="42" fill="#4d7c0f" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" letter-spacing="2">Python</text>

  <rect x="40" y="66" width="300" height="168" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="60" y="100" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="15">{</text>
  <text x="80" y="128" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="15">"name": "小明",</text>
  <text x="80" y="156" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="15">"age": 18,</text>
  <text x="80" y="184" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="15">"tags": ["python"]</text>
  <text x="60" y="212" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="15">}</text>

  <rect x="410" y="66" width="270" height="168" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="430" y="100" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="15">{</text>
  <text x="450" y="128" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="15">"name": "小明",</text>
  <text x="450" y="156" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="15">"age": 18,</text>
  <text x="450" y="184" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="15">"tags": ["python"]</text>
  <text x="430" y="212" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="15">}</text>

  <text x="360" y="150" text-anchor="middle" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24">=</text>

  <text x="360" y="262" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">JSON 对象对应 Python 字典，JSON 数组对应 Python 列表。</text>
</svg>
