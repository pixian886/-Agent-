<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
  <title id="title">一次 LLM API 调用的流程</title>
  <desc id="desc">客户端把 messages 发到 base_url，模型返回 choices 与 usage。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4442a"/>
    </marker>
  </defs>

  <rect x="32" y="70" width="190" height="150" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="127" y="98" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold">messages</text>
  <text x="127" y="126" text-anchor="middle" fill="#6b6b5e" font-family="Consolas, Courier New, monospace" font-size="12">system</text>
  <text x="127" y="150" text-anchor="middle" fill="#6b6b5e" font-family="Consolas, Courier New, monospace" font-size="12">user</text>
  <text x="127" y="174" text-anchor="middle" fill="#6b6b5e" font-family="Consolas, Courier New, monospace" font-size="12">assistant</text>
  <text x="127" y="202" text-anchor="middle" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">对话上下文</text>

  <rect x="290" y="52" width="180" height="186" rx="14" fill="#fffcf5" stroke="#b4442a" stroke-width="2"/>
  <text x="380" y="82" text-anchor="middle" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold">API 服务</text>
  <text x="380" y="110" text-anchor="middle" fill="#6b6b5e" font-family="Consolas, Courier New, monospace" font-size="11">POST /chat/completions</text>
  <text x="380" y="138" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="12">base_url</text>
  <text x="380" y="162" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="12">model</text>
  <text x="380" y="186" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="12">Authorization</text>
  <text x="380" y="216" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">你的 Key 只放在请求头</text>

  <rect x="538" y="70" width="190" height="150" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="633" y="98" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold">response</text>
  <text x="633" y="126" text-anchor="middle" fill="#6b6b5e" font-family="Consolas, Courier New, monospace" font-size="10">choices[0].message.content</text>
  <text x="633" y="152" text-anchor="middle" fill="#6b6b5e" font-family="Consolas, Courier New, monospace" font-size="11">usage.prompt_tokens</text>
  <text x="633" y="174" text-anchor="middle" fill="#6b6b5e" font-family="Consolas, Courier New, monospace" font-size="11">usage.completion_tokens</text>
  <text x="633" y="202" text-anchor="middle" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">文本 + 用量</text>

  <line x1="226" y1="145" x2="282" y2="145" stroke="#b4442a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="474" y1="145" x2="530" y2="145" stroke="#b4442a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="254" y="134" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">请求</text>
  <text x="502" y="134" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">返回</text>

  <text x="380" y="282" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">同一个调用：换 base_url 与 model 就能切换兼容厂商，messages 结构不变。</text>
</svg>
