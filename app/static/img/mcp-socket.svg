<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">MCP 是 Agent 与工具之间的插座</title>
  <desc id="desc">Agent 通过 MCP client，经 JSON-RPC 协议访问暴露工具与数据的 MCP server。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4442a"/>
    </marker>
  </defs>

  <rect x="28" y="94" width="160" height="116" rx="14" fill="#fffcf5" stroke="#b4442a" stroke-width="2"/>
  <text x="108" y="124" text-anchor="middle" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold">Agent</text>
  <text x="108" y="150" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">LLM + 循环</text>
  <text x="108" y="172" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">MCP client</text>
  <text x="108" y="194" text-anchor="middle" fill="#6b6b5e" font-family="Consolas, Courier New, monospace" font-size="10">list / call</text>

  <rect x="250" y="78" width="230" height="150" rx="14" fill="#f4efe4" stroke="#b9ad99" stroke-width="2"/>
  <text x="365" y="106" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold">MCP 协议</text>
  <text x="365" y="132" text-anchor="middle" fill="#6b6b5e" font-family="Consolas, Courier New, monospace" font-size="11">JSON-RPC</text>
  <text x="365" y="158" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="11">tools/list</text>
  <text x="365" y="180" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="11">tools/call</text>
  <text x="365" y="208" text-anchor="middle" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">统一发现与调用方式</text>

  <rect x="548" y="56" width="180" height="54" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="638" y="78" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">文件系统 server</text>
  <text x="638" y="98" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">读文件 / 列目录</text>

  <rect x="548" y="126" width="180" height="54" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="638" y="148" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">数据库 server</text>
  <text x="638" y="168" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">查询订单</text>

  <rect x="548" y="196" width="180" height="54" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="638" y="218" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">HTTP server</text>
  <text x="638" y="238" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">调用外部 API</text>

  <line x1="194" y1="152" x2="242" y2="152" stroke="#b4442a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="486" y1="152" x2="540" y2="120" stroke="#b4442a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="486" y1="152" x2="540" y2="152" stroke="#b4442a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="486" y1="152" x2="540" y2="214" stroke="#b4442a" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="380" y="292" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">MCP 是协议，不是框架；server 暴露能力，Agent 通过 client 发现并调用。</text>
</svg>
