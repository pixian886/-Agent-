<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 角色与共享状态</title>
  <desc id="desc">监督者把任务分给 planner、researcher、writer、reviewer，各角色通过共享状态协作。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4442a"/>
    </marker>
  </defs>

  <rect x="292" y="34" width="176" height="58" rx="14" fill="#fffcf5" stroke="#b4442a" stroke-width="2"/>
  <text x="380" y="59" text-anchor="middle" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold">监督者</text>
  <text x="380" y="80" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">分派 · 合并 · 终止</text>

  <rect x="52" y="150" width="150" height="62" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="127" y="176" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold">planner</text>
  <text x="127" y="197" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">拆解步骤</text>

  <rect x="228" y="150" width="150" height="62" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="303" y="176" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold">researcher</text>
  <text x="303" y="197" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">检索资料</text>

  <rect x="404" y="150" width="150" height="62" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="479" y="176" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold">writer</text>
  <text x="479" y="197" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">组织答案</text>

  <rect x="580" y="150" width="150" height="62" rx="12" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="655" y="176" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold">reviewer</text>
  <text x="655" y="197" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">检查与驳回</text>

  <line x1="330" y1="96" x2="150" y2="142" stroke="#b4442a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355" y1="96" x2="310" y2="142" stroke="#b4442a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="405" y1="96" x2="470" y2="142" stroke="#b4442a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="432" y1="96" x2="640" y2="142" stroke="#b4442a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="250" width="520" height="58" rx="12" fill="#f4efe4" stroke="#b9ad99" stroke-dasharray="6 4"/>
  <text x="380" y="274" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="bold">共享状态</text>
  <text x="380" y="295" text-anchor="middle" fill="#6b6b5e" font-family="Consolas, Courier New, monospace" font-size="10">task · messages · files · trace · final</text>

  <path d="M 380 226 C 380 240, 380 240, 380 246" fill="none" stroke="#6b6b5e" stroke-width="2"/>
  <path d="M 655 216 C 655 236, 640 242, 610 248" fill="none" stroke="#6b6b5e" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="380" y="330" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">角色边界清楚比角色数量重要；每个角色都要有输入、输出与停止条件。</text>
</svg>
