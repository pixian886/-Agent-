<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
  <title id="title">Python 代码的运行过程</title>
  <desc id="desc">源码经过 Python 解释器执行，最后输出结果。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4442a"/>
    </marker>
  </defs>

  <text x="40" y="42" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">你写的文件</text>
  <text x="282" y="42" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">读取并执行</text>
  <text x="526" y="42" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">看到结果</text>

  <rect x="40" y="66" width="180" height="104" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="130" y="106" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">源码</text>
  <text x="130" y="138" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="18">hello.py</text>

  <rect x="270" y="66" width="180" height="104" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="360" y="106" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">解释器</text>
  <text x="360" y="138" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="18">Python 3.x</text>

  <rect x="500" y="66" width="180" height="104" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="590" y="106" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">输出</text>
  <text x="590" y="138" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="16">Hello, Python!</text>

  <line x1="224" y1="118" x2="262" y2="118" stroke="#b4442a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="454" y1="118" x2="492" y2="118" stroke="#b4442a" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="360" y="214" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">源码是文本，解释器负责按顺序执行它。</text>
</svg>
