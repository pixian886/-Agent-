<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">ReAct 循环</title>
  <desc id="desc">思考、行动、观察三步循环，观察结果放回上下文，直到 Finish 结束。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4442a"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b5e"/>
    </marker>
  </defs>

  <rect x="48" y="86" width="170" height="86" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="133" y="116" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold">Thought</text>
  <text x="133" y="139" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">现在缺什么信息</text>
  <text x="133" y="159" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">下一步做什么</text>

  <rect x="295" y="86" width="170" height="86" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="380" y="116" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold">Action</text>
  <text x="380" y="139" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">选择工具与参数</text>
  <text x="380" y="159" text-anchor="middle" fill="#6b6b5e" font-family="Consolas, Courier New, monospace" font-size="10">get_weather(city)</text>

  <rect x="542" y="86" width="170" height="86" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="627" y="116" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold">Observation</text>
  <text x="627" y="139" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">工具返回的结果</text>
  <text x="627" y="159" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">成功或错误都算</text>

  <line x1="222" y1="129" x2="287" y2="129" stroke="#b4442a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="469" y1="129" x2="534" y2="129" stroke="#b4442a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M 627 178 C 627 246, 133 246, 133 180" fill="none" stroke="#6b6b5e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-soft)"/>
  <text x="380" y="238" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11">观察写回上下文，开始下一轮</text>

  <rect x="295" y="274" width="170" height="44" rx="10" fill="#fffcf5" stroke="#b4442a"/>
  <text x="380" y="301" text-anchor="middle" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold">Finish：给出最终答案</text>
  <line x1="627" y1="174" x2="470" y2="286" stroke="#b4442a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="238" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">信息够了就停</text>

  <text x="380" y="28" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold">ReAct = 思考 → 行动 → 观察 的循环</text>
</svg>
