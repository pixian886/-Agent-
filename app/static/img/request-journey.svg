<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">一次 Web 请求的旅程</title>
  <desc id="desc">浏览器向 FastAPI 发送请求，FastAPI 查询 SQLite，再用模板返回 HTML。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4442a"/>
    </marker>
  </defs>

  <text x="40" y="42" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">一次请求的旅程</text>

  <rect x="30" y="86" width="150" height="104" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="105" y="126" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16">浏览器</text>
  <text x="105" y="154" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">发送请求</text>

  <rect x="230" y="86" width="150" height="104" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="305" y="126" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16">FastAPI</text>
  <text x="305" y="154" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">路由与表单</text>

  <rect x="430" y="86" width="150" height="104" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="505" y="126" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16">SQLite</text>
  <text x="505" y="154" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">保存留言</text>

  <rect x="630" y="86" width="110" height="104" rx="14" fill="#fffcf5" stroke="#d8cfc0"/>
  <text x="685" y="126" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16">HTML</text>
  <text x="685" y="154" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">返回页面</text>

  <line x1="186" y1="138" x2="220" y2="138" stroke="#b4442a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="386" y1="138" x2="420" y2="138" stroke="#b4442a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="586" y1="138" x2="620" y2="138" stroke="#b4442a" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="203" y="122" text-anchor="middle" fill="#b4442a" font-family="Consolas, Courier New, monospace" font-size="11">GET/POST</text>
  <text x="403" y="122" text-anchor="middle" fill="#b4442a" font-family="Consolas, Courier New, monospace" font-size="11">SQL</text>
  <text x="603" y="122" text-anchor="middle" fill="#b4442a" font-family="Consolas, Courier New, monospace" font-size="11">渲染</text>

  <path d="M 685 200 C 685 244 105 244 105 200" fill="none" stroke="#4d7c0f" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="395" y="264" text-anchor="middle" fill="#4d7c0f" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">响应回到浏览器，页面显示最新留言</text>
</svg>
