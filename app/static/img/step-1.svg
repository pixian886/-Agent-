<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
  <title id="title">创建一个空盒子</title>
  <desc id="desc">创建变量 age，盒子里还没有值。</desc>

  <rect x="210" y="58" width="300" height="120" rx="14" fill="#fffcf5" stroke="#b9ad99" stroke-width="2" stroke-dasharray="8 6"/>
  <path d="M 210 90 L 210 58 L 300 58 L 300 90 Z" fill="#f0e5d2" stroke="#b9ad99" stroke-width="2"/>
  <text x="255" y="80" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="14">age</text>
  <text x="360" y="136" text-anchor="middle" fill="#b9ad99" font-family="Consolas, Courier New, monospace" font-size="38">?</text>

  <text x="360" y="222" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">第 1 步：创建变量 age，盒子还是空的。</text>
</svg>
