<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
  <title id="title">把 18 放进盒子</title>
  <desc id="desc">变量 age 的值变成 18。</desc>

  <rect x="210" y="58" width="300" height="120" rx="14" fill="#fffcf5" stroke="#b9ad99" stroke-width="2"/>
  <path d="M 210 90 L 210 58 L 300 58 L 300 90 Z" fill="#f0e5d2" stroke="#b9ad99" stroke-width="2"/>
  <text x="255" y="80" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="14">age</text>
  <text x="360" y="136" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="44">18</text>

  <path d="M 548 116 L 520 128" fill="none" stroke="#b4442a" stroke-width="3"/>
  <circle cx="548" cy="112" r="5" fill="#b4442a"/>
  <text x="566" y="106" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">18</text>

  <text x="360" y="222" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">第 2 步：把 18 放进去，age 的值变成 18。</text>
</svg>
