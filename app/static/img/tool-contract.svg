<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">工具契约：模型看什么，运行时做什么</title>
  <desc id="desc">模型看到名称、描述与参数，输出 tool_calls；运行时执行真正的函数。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4442a"/>
    </marker>
  </defs>

  <rect x="24" y="42" width="480" height="200" rx="16" fill="#fffcf5" stroke="#d8cfc0" stroke-dasharray="8 6"/>
  <text x="44" y="70" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" letter-spacing="2">模型能看到</text>

  <rect x="44" y="86" width="130" height="70" rx="10" fill="#f4efe4" stroke="#d8cfc0"/>
  <text x="109" y="112" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold">名称</text>
  <text x="109" y="134" text-anchor="middle" fill="#6b6b5e" font-family="Consolas, Courier New, monospace" font-size="10">get_weather</text>

  <rect x="194" y="86" width="130" height="70" rx="10" fill="#f4efe4" stroke="#d8cfc0"/>
  <text x="259" y="112" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold">描述</text>
  <text x="259" y="134" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">什么时候用</text>

  <rect x="344" y="86" width="140" height="70" rx="10" fill="#f4efe4" stroke="#d8cfc0"/>
  <text x="414" y="112" text-anchor="middle" fill="#1f2933" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold">参数 Schema</text>
  <text x="414" y="134" text-anchor="middle" fill="#6b6b5e" font-family="Consolas, Courier New, monospace" font-size="10">city: string</text>

  <rect x="44" y="176" width="440" height="48" rx="10" fill="#fffcf5" stroke="#b9ad99"/>
  <text x="264" y="198" text-anchor="middle" fill="#b4442a" font-family="Consolas, Courier New, monospace" font-size="11">tool_calls: {"name": "get_weather", "arguments": {...}}</text>
  <text x="264" y="216" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">模型只给出意图，不执行</text>

  <line x1="510" y1="196" x2="584" y2="196" stroke="#b4442a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="596" y="142" width="142" height="108" rx="14" fill="#fffcf5" stroke="#b4442a" stroke-width="2"/>
  <text x="667" y="170" text-anchor="middle" fill="#b4442a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="bold">执行函数</text>
  <text x="667" y="194" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">运行时真正运行</text>
  <text x="667" y="216" text-anchor="middle" fill="#1f2933" font-family="Consolas, Courier New, monospace" font-size="10">def get_weather(...)</text>
  <text x="667" y="238" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10">访问网络 / 数据库</text>

  <text x="380" y="290" text-anchor="middle" fill="#6b6b5e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">名称、描述、参数决定模型会不会用；执行函数决定调用时发生什么。</text>
</svg>
